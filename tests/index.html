<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>测试 · 赛肯德小工具</title>
<meta name="description" content="恋爱说明书、校招测评自测……几个几分钟就能做完的小测试。" />
<meta name="theme-color" content="#4a8c82" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171917" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2363b8a9'/%3E%3Cstop offset='1' stop-color='%2331665e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23g)'/%3E%3Cpath d='M43 22c-1.5-3.5-6-5.5-11.5-5.5-6.5 0-11 2.8-11 7.2 0 4.2 4.4 5.6 11 6.6 6.6 1 11 2.8 11 7.2 0 4.4-4.8 7.2-11.5 7.2-5.6 0-10.3-2-11.7-5.6' fill='none' stroke='%23fff' stroke-width='6.2' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/icons/icon-brand-180.png" />
<style>
  :root {
    color-scheme: light dark;
    --fs-hero: 28px; --fs-title: 17px; --fs-body: 15px; --fs-sub: 13px; --fs-cap: 11px;
    --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    --r-card: 16px; --r-big: 20px; --r-control: 12px; --r-pill: 999px;
    --accent: light-dark(#4a8c82, #7fbcb0);
    --accent-soft: light-dark(#e9f2ef, rgba(127, 188, 176, .16));
    --text: light-dark(rgba(42, 42, 38, .92), rgba(238, 237, 233, .94));
    --muted: light-dark(rgba(42, 42, 38, .52), rgba(238, 237, 233, .58));
    --line: light-dark(rgba(42, 42, 38, .08), rgba(255, 255, 255, .1));
    --surface: light-dark(#ffffff, #1c1e1d);
    --bg: light-dark(#f2f1ec, #171917);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: var(--fs-body); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: var(--sp-5) var(--sp-4) calc(var(--sp-6) + env(safe-area-inset-bottom));
    touch-action: manipulation;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-5); }

  .back { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sub); color: var(--muted); text-decoration: none; }
  .back:active { color: var(--accent); }

  .hero { display: flex; flex-direction: column; gap: var(--sp-2); }
  .hero h1 { margin: 0; font-size: var(--fs-hero); font-weight: var(--fw-semibold); line-height: 1.2; letter-spacing: -.01em; }
  .hero p { margin: 0; font-size: var(--fs-sub); color: var(--muted); }

  .list { display: flex; flex-direction: column; gap: var(--sp-4); }

  .tcard {
    display: flex; align-items: center; gap: var(--sp-4);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-big);
    padding: var(--sp-4); text-decoration: none; color: inherit;
    box-shadow: 0 2px 10px rgba(42, 42, 38, .05);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .tcard:active { transform: scale(.985); box-shadow: 0 1px 6px rgba(42, 42, 38, .08); }
  .tcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .tico { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
  .tico svg { width: 32px; height: 32px; display: block; }
  .tico.love { background: linear-gradient(135deg, #f58fae, #d2416f); }
  .tico.campus { background: linear-gradient(135deg, #7c8ede, #41539f); }

  .tbody { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .tbody strong { font-size: var(--fs-title); font-weight: var(--fw-semibold); }
  .tbody span { font-size: var(--fs-sub); color: var(--muted); }
  .tmeta { display: flex; gap: var(--sp-2); margin-top: 2px; flex-wrap: wrap; }
  .tmeta em { font-style: normal; font-size: var(--fs-cap); color: var(--muted); background: var(--accent-soft); border-radius: var(--r-pill); padding: 3px 9px; }

  .chev { flex: 0 0 auto; color: var(--muted); font-size: 18px; line-height: 1; }

  .ft { border-top: 1px solid var(--line); padding-top: var(--sp-4); font-size: var(--fs-cap); color: var(--muted); }
  .ft p { margin: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← 赛肯德小工具</a>

    <header class="hero">
      <h1>测试</h1>
      <p>几分钟做完，直接出结果。挑一个玩玩。</p>
    </header>

    <section class="list">
      <a class="tcard" href="./love/">
        <span class="tico love" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none"><path d="M32 50S13 39.6 13 27.6A10.6 10.6 0 0 1 32 21.2 10.6 10.6 0 0 1 51 27.6C51 39.6 32 50 32 50z" fill="#fff"/></svg>
        </span>
        <span class="tbody">
          <strong>我们的恋爱说明书</strong>
          <span>两个人轮流答，出一张双人雷达图</span>
          <span class="tmeta"><em>各 20 题</em><em>约 6 分钟</em><em>可异地</em></span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>

      <a class="tcard" href="./campus/">
        <span class="tico campus" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none"><rect x="15" y="12" width="34" height="40" rx="8" fill="#fff"/><rect x="23" y="24" width="18" height="4" rx="2" fill="#41539f"/><rect x="23" y="33" width="18" height="4" rx="2" fill="#41539f"/><rect x="23" y="42" width="11" height="4" rx="2" fill="#41539f"/></svg>
        </span>
        <span class="tbody">
          <strong>校招测评自测</strong>
          <span>看看你的作答风格会不会被判无效</span>
          <span class="tmeta"><em>16 题</em><em>约 3 分钟</em></span>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </section>

    <footer class="ft">
      <p>所有测试都在你的手机上运行，不会上传任何作答数据。</p>
    </footer>
  </main>
</body>
</html>
