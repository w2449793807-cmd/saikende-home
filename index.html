<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>赛肯德小工具</title>
<meta name="description" content="赛肯德小工具 · 旅行、出行、过日子用得上的小工具集合。" />
<meta name="theme-color" content="#4a8c82" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171917" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a9c8ff'/%3E%3Cstop offset='.5' stop-color='%235b8cf5'/%3E%3Cstop offset='1' stop-color='%231c47c4'/%3E%3C/linearGradient%3E%3ClinearGradient id='sh' x1='0' y1='1' x2='0' y2='0'%3E%3Cstop offset='0' stop-color='%23ffffff' stop-opacity='0'/%3E%3Cstop offset='1' stop-color='%23ffffff' stop-opacity='.22'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='url(%23bg)'/%3E%3Crect width='64' height='64' rx='18' fill='url(%23sh)'/%3E%3Cpath d='M45 23c-2-6.6-7.5-9-13.5-9-7 0-12.5 3.6-12.5 9 0 4.4 3.6 6.6 9.5 8' fill='none' stroke='%23ffffff' stroke-width='7.6' stroke-linecap='round'/%3E%3Cpath d='M36 33.5c6.5 1.7 9 4.1 9 8 0 5.7-5.8 9.1-13 9.1-6.5 0-11.4-2.4-13-8' fill='none' stroke='%23ffffff' stroke-width='7.6' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="/icons/icon-brand-180.png" />
<style>
  :root {
    color-scheme: light dark;
    /* 设计令牌：字阶 5 档、间距 8pt 栅格、圆角两档（与工具页保持一致） */
    --fs-hero: 28px;
    --fs-title: 17px;
    --fs-body: 15px;
    --fs-sub: 13px;
    --fs-cap: 11px;
    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    --r-card: 16px; --r-control: 12px; --r-pill: 999px;
    --tap-min: 44px; --btn-lg: 48px;

    --accent: #4a8c82;
    --accent: light-dark(#4a8c82, #7fbcb0);
    --accent-soft: #e9f2ef;
    --accent-soft: light-dark(#e9f2ef, rgba(127, 188, 176, .16));
    --accent-ink: #ffffff;
    --accent-ink: light-dark(#ffffff, #10181a);

    --text: rgba(42, 42, 38, .92);
    --text: light-dark(rgba(42, 42, 38, .92), rgba(238, 237, 233, .94));
    --muted: rgba(42, 42, 38, .5);
    --muted: light-dark(rgba(42, 42, 38, .5), rgba(238, 237, 233, .56));
    --line: rgba(42, 42, 38, .08);
    --line: light-dark(rgba(42, 42, 38, .08), rgba(255, 255, 255, .1));
    --surface: #ffffff;
    --surface: light-dark(#ffffff, #1c1e1d);
    --bg: #f2f1ec;
    --bg: light-dark(#f2f1ec, #171917);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: var(--fs-body); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: var(--sp-5) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom));
    font-variant-numeric: tabular-nums;
    touch-action: manipulation;   /* 关掉连点两下触发的页面缩放 */
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-5); }

  .hero { display: flex; flex-direction: column; gap: var(--sp-3); }
  .hero h1 { margin: 0; font-size: var(--fs-hero); font-weight: var(--fw-semibold); line-height: 1.2; letter-spacing: -.01em; }
  .sec { display: flex; flex-direction: column; gap: var(--sp-4); }
  .sec h2 { margin: 0; font-size: var(--fs-sub); font-weight: var(--fw-medium); color: var(--muted); }

  .apps { display: flex; flex-wrap: wrap; gap: var(--sp-4); }
  .app {
    width: 88px; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
    text-decoration: none; color: inherit; border-radius: var(--r-control);
  }
  .app-icon {
    width: 72px; height: 72px; border-radius: var(--r-card);
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-title); font-weight: var(--fw-semibold); letter-spacing: .03em;
    box-shadow: 0 6px 18px rgba(74, 140, 130, .22);
    transition: transform .14s ease;
  }
  .app:active .app-icon { transform: scale(.94); }
  .app:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .app-name { font-size: var(--fs-sub); line-height: 1.35; text-align: center; }

  /* 测试：与「工具」同级的入口，做成整宽卡片，比图标更大更醒目 */
  .feature {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-4);
    border-radius: var(--r-big);
    text-decoration: none; color: inherit;
    background: var(--feature-bg);
    border: 1px solid var(--line);
    box-shadow: 0 6px 20px rgba(42, 42, 38, .07);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  :root { --feature-bg: light-dark(linear-gradient(112deg, #fff2f7 0%, #ffffff 46%, #f1f4ff 100%), linear-gradient(112deg, rgba(245,143,174,.16) 0%, rgba(28,30,29,1) 46%, rgba(124,142,222,.16) 100%)); }
  .feature:active { transform: scale(.985); box-shadow: 0 3px 12px rgba(42, 42, 38, .1); }
  .feature:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .f-ic { flex: 0 0 auto; position: relative; width: 62px; height: 62px; }
  .f-ic span {
    position: absolute; width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(42, 42, 38, .16);
  }
  .f-ic span svg { width: 22px; height: 22px; display: block; }
  .f-ic .b1 { left: 0; top: 0; background: linear-gradient(135deg, #f58fae, #d2416f); transform: rotate(-8deg); }
  .f-ic .b2 { right: 0; bottom: 0; background: linear-gradient(135deg, #7c8ede, #41539f); transform: rotate(6deg); }

  .f-tx { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .f-tx strong { font-size: var(--fs-title); font-weight: var(--fw-semibold); }
  .f-tx span { font-size: var(--fs-sub); color: var(--muted); }
  .f-go { flex: 0 0 auto; color: var(--muted); font-size: 20px; line-height: 1; }

  .more { margin: 0; font-size: var(--fs-cap); color: var(--muted); }
  .ft { display: flex; flex-direction: column; gap: var(--sp-1); border-top: 1px solid var(--line); padding-top: var(--sp-4); }
  .ft p { margin: 0; font-size: var(--fs-cap); color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>赛肯德小工具</h1>
    </header>

    <section class="sec" aria-labelledby="tools-title">
      <h2 id="tools-title">工具</h2>
      <div class="apps">
        <a class="app" href="https://aa.saikende.cn/">
          <span class="app-icon" aria-hidden="true">AA</span>
          <span class="app-name">旅行 AA<br />小工具</span>
        </a>
      </div>
      <p class="more">更多工具，敬请期待</p>
    </section>

    <section class="sec" aria-labelledby="tests-title">
      <h2 id="tests-title">测试</h2>
      <a class="feature" href="./tests/">
        <span class="f-ic" aria-hidden="true">
          <span class="b1">
            <svg viewBox="0 0 64 64" fill="none"><path d="M32 50S13 39.6 13 27.6A10.6 10.6 0 0 1 32 21.2 10.6 10.6 0 0 1 51 27.6C51 39.6 32 50 32 50z" fill="#fff" /></svg>
          </span>
          <span class="b2">
            <svg viewBox="0 0 64 64" fill="none"><rect x="15" y="12" width="34" height="40" rx="8" fill="#fff" /><rect x="23" y="24" width="18" height="4" rx="2" fill="#41539f" /><rect x="23" y="33" width="18" height="4" rx="2" fill="#41539f" /><rect x="23" y="42" width="11" height="4" rx="2" fill="#41539f" /></svg>
          </span>
        </span>
        <span class="f-tx">
          <strong>来做个小测试</strong>
        </span>
        <span class="f-go" aria-hidden="true">›</span>
      </a>
      <p class="more">几分钟测试，即可看结果</p>
    </section>

    <footer class="ft">
      <p>© 2026 赛肯德小工具 · 保留所有权利</p>
      <p>尊重用户隐私，不接弹出广告</p>
    </footer>
  </main>
</body>
</html>
