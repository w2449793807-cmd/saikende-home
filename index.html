<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>赛肯德工具箱</title>
<meta name="description" content="出门在外用得上的一点小工具。不用注册，账目只存在你自己手机上。" />
<meta name="theme-color" content="#4a8c82" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#171917" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234a8c82'/%3E%3Ctext x='32' y='42' font-size='30' font-family='-apple-system,sans-serif' font-weight='600' fill='%23fff' text-anchor='middle'%3EAA%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    color-scheme: light dark;
    /* 设计令牌：字阶 5 档、间距 8pt 栅格、圆角两档（与工具页保持一致） */
    --fs-hero: 28px;
    --fs-title: 17px;
    --fs-body: 15px;
    --fs-sub: 13px;
    --fs-cap: 11px;
    --fw-regular: 400;
    --fw-medium: 500;
    --fw-semibold: 600;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px;
    --r-card: 16px; --r-control: 12px; --r-pill: 999px;
    --tap-min: 44px; --btn-lg: 48px;

    --accent: #4a8c82;
    --accent: light-dark(#4a8c82, #7fbcb0);
    --accent-soft: #e9f2ef;
    --accent-soft: light-dark(#e9f2ef, rgba(127, 188, 176, .16));
    --accent-ink: #ffffff;
    --accent-ink: light-dark(#ffffff, #10181a);

    --text: rgba(42, 42, 38, .92);
    --text: light-dark(rgba(42, 42, 38, .92), rgba(238, 237, 233, .94));
    --muted: rgba(42, 42, 38, .5);
    --muted: light-dark(rgba(42, 42, 38, .5), rgba(238, 237, 233, .56));
    --line: rgba(42, 42, 38, .08);
    --line: light-dark(rgba(42, 42, 38, .08), rgba(255, 255, 255, .1));
    --surface: #ffffff;
    --surface: light-dark(#ffffff, #1c1e1d);
    --bg: #f2f1ec;
    --bg: light-dark(#f2f1ec, #171917);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: var(--fs-body); line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    padding: var(--sp-5) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom));
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--sp-5); }

  .hero { display: flex; flex-direction: column; gap: var(--sp-3); }
  .hero h1 { margin: 0; font-size: var(--fs-hero); font-weight: var(--fw-semibold); line-height: 1.2; letter-spacing: -.01em; }
  .lede { margin: 0; font-size: var(--fs-sub); color: var(--muted); }

  .sec { display: flex; flex-direction: column; gap: var(--sp-4); }
  .sec h2 { margin: 0; font-size: var(--fs-sub); font-weight: var(--fw-medium); color: var(--muted); }

  .apps { display: flex; flex-wrap: wrap; gap: var(--sp-4); }
  .app {
    width: 88px; display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
    text-decoration: none; color: inherit; border-radius: var(--r-control);
  }
  .app-icon {
    width: 72px; height: 72px; border-radius: var(--r-card);
    background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--fs-title); font-weight: var(--fw-semibold); letter-spacing: .03em;
    box-shadow: 0 6px 18px rgba(74, 140, 130, .22);
    transition: transform .14s ease;
  }
  .app:active .app-icon { transform: scale(.94); }
  .app:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .app-name { font-size: var(--fs-sub); line-height: 1.35; text-align: center; }

  .more { margin: 0; font-size: var(--fs-cap); color: var(--muted); }
  .ft { display: flex; flex-direction: column; gap: var(--sp-1); border-top: 1px solid var(--line); padding-top: var(--sp-4); }
  .ft p { margin: 0; font-size: var(--fs-cap); color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <h1>赛肯德工具箱</h1>
      <p class="lede">出门在外用得上的一点小工具。不用注册，账目只存在你自己手机上。</p>
    </header>

    <section class="sec" aria-labelledby="tools-title">
      <h2 id="tools-title">工具</h2>
      <div class="apps">
        <a class="app" href="https://aa.saikende.cn/">
          <span class="app-icon" aria-hidden="true">AA</span>
          <span class="app-name">旅行 AA<br />分摊器</span>
        </a>
      </div>
      <p class="more">更多工具还在做，做好一个放一个。</p>
    </section>

    <footer class="ft">
      <p>© 2026 赛肯德工具箱 · 保留所有权利</p>
      <p>这个首页不收集任何信息，没有统计埋点，也没有广告。</p>
    </footer>
  </main>
</body>
</html>
